name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p vanta --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          bin="target/${target}/release/vanta"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          mkdir -p dist
          cp "$bin" dist/
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf "vanta-${version}-${target}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: vanta-${{ matrix.target }}
          path: vanta-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum vanta-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/vanta-*.tar.gz dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "Vanta $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
